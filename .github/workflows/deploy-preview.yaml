name: Sync Vault and Deploy
on:
  repository_dispatch:
    types: [vault-updated]
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Starfall_Wiki
        uses: actions/checkout@v4
        with:
          ref: v4
      - name: Checkout Starfall_Universe (vault)
        uses: actions/checkout@v4
        with:
          repository: amr467/Starfall_Universe
          token: ${{ secrets.VAULT_ACCESS_TOKEN }}
          path: vault-temp
          ref: main
      - name: Copy vault files into content/
        run: |
          rsync -av --delete vault-temp/ content/
          rm -rf vault-temp
      - name: Build concept graph
        run: |
          echo "Python version:"
          python3 --version
          echo "Content dir contents:"
          ls content/
          echo "Running script..."
          python3 scripts/build_graph.py
          echo "Script exit code: $?"
        continue-on-error: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public