name: Sync Vault and Deploy

on:
  repository_dispatch:
    types: [vault-updated]

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Starfall_Wiki
        uses: actions/checkout@v4

      - name: Checkout Starfall_Universe (vault)
        uses: actions/checkout@v4
        with:
          repository: amr467/Starfall_Universe
          token: ${{ secrets.VAULT_ACCESS_TOKEN }}
          path: vault-temp

      - name: Copy vault files into content/
        run: |
          mkdir -p content
          cp vault-temp/*.md content/ 2>/dev/null || true
          cp vault-temp/*.png content/ 2>/dev/null || true
          rm -rf vault-temp

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public